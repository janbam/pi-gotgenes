name: Release

# Releases are explicit. Several packages can be releasable at once — parallel
# worktrees make that normal — and naming them is what keeps releasing one from
# dragging a sibling along (Refs #865).
#
# `/ship` dispatches this workflow after the work is on main, then watches it
# with `ci_find`/`ci_watch` (workflow `release`).
# This personal fork cuts Git tags and GitHub Releases only. npm publication is
# deliberately absent rather than guarded by credentials (AGENTS.md).
on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Package directory names, space- or comma-separated (e.g. 'pi-subagents pi-colgrep')"
        required: true
        type: string
      sha:
        description: "Expected HEAD SHA — aborts if main moved since the release was requested"
        required: false
        type: string

# One release at a time. This replaces the convention that only the root session
# releases, so peers cannot race even by accident.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      # Only `sha` is consumed — the downstream jobs derive the released set
      # themselves from `git tag --points-at HEAD`, so a `tags` output here
      # would be wiring nothing.
      sha: ${{ steps.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          # Prefer the historical PAT so the release push starts ordinary CI.
          # Forks without that secret still release through this job's scoped
          # contents:write token; downstream jobs verify the exact pushed SHA.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          # Full history and tags: git-cliff derives every version and changelog
          # from them, and a shallow clone would silently produce wrong versions.
          fetch-depth: 0

      - uses: taiki-e/install-action@git-cliff

      - name: Prepare release
        id: prepare
        env:
          PACKAGES: ${{ inputs.packages }}
          EXPECTED_SHA: ${{ inputs.sha }}
        run: ./scripts/release/prepare-release.sh

  github-release:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Consume the exact Git release commit; main may move between jobs.
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - uses: taiki-e/install-action@git-cliff

      - name: Create GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/release/create-github-releases.sh
